name: Update live mortgage rates

on:
  schedule:
    - cron: "30 17 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live-rates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest FRED mortgage rates
        run: node scripts/update-live-rates.mjs

      - name: Commit updated rates
        run: |
          if [[ -z "$(git status --porcelain data/live-rates.json)" ]]; then
            echo "No live-rate changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-rates.json
          git commit -m "Update live mortgage rates"
          git push
